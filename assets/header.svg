<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Caio Moraes — Software Developer</title>
  <desc id="description">Banner escuro com foco em automação, dados e inteligência artificial aplicada.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0B131B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#39D0C6"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8B949E" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Courier New",monospace}.small{font-size:12px;font-weight:600;letter-spacing:2px}.chip{font-size:12px;font-weight:600;letter-spacing:.5px}.pipelineTitle{font-size:11px;font-weight:700;letter-spacing:1.6px}.pipelineText{font-size:13px;font-weight:600}.pipelineMeta{font-size:10px;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <path d="M0 18C0 8 8 0 18 0H1182C1192 0 1200 8 1200 18V22H0Z" fill="url(#accent)"/>
  <text x="1020" y="246" class="sans" font-size="180" font-weight="800" text-anchor="middle" fill="#FFFFFF" opacity=".025">CM</text>

  <rect x="58" y="53" width="4" height="214" rx="2" fill="url(#accent)"/>
  <rect x="84" y="54" width="196" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
  <circle cx="102" cy="68" r="4" fill="#39D0C6" filter="url(#softGlow)"/>
  <text x="116" y="72" class="mono small" fill="#8B949E">SOFTWARE DEVELOPER</text>

  <text x="82" y="142" class="sans" font-size="54" font-weight="750" letter-spacing="-1.5" fill="#F0F6FC">CAIO MORAES</text>
  <text x="84" y="177" class="mono" font-size="16" letter-spacing="2.2" fill="#8B949E">AUTOMAÇÃO  /  DADOS  /  IA APLICADA</text>
  <text x="84" y="213" class="sans" font-size="15" fill="#C9D1D9">Sistemas práticos para problemas reais.</text>

  <g transform="translate(84 235)">
    <rect width="78" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="39" y="18" class="mono chip" text-anchor="middle" fill="#C9D1D9">PYTHON</text>
    <rect x="88" width="102" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="139" y="18" class="mono chip" text-anchor="middle" fill="#C9D1D9">TYPESCRIPT</text>
    <rect x="200" width="58" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="229" y="18" class="mono chip" text-anchor="middle" fill="#C9D1D9">SQL</text>
    <rect x="268" width="58" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
    <text x="297" y="18" class="mono chip" text-anchor="middle" fill="#C9D1D9">RAG</text>
  </g>

  <g transform="translate(760 49)">
    <rect width="382" height="226" rx="14" fill="#0D1117" fill-opacity=".76" stroke="#30363D"/>
    <circle cx="22" cy="22" r="4" fill="#F85149"/><circle cx="36" cy="22" r="4" fill="#D29922"/><circle cx="50" cy="22" r="4" fill="#3FB950"/>
    <text x="72" y="26" class="mono pipelineTitle" fill="#8B949E">PIPELINE / PRODUÇÃO</text>
    <line x1="45" y1="70" x2="45" y2="177" stroke="#30363D" stroke-width="2"/>
    <line x1="45" y1="70" x2="45" y2="177" stroke="url(#accent)" stroke-width="2" stroke-dasharray="17 13"/>
    <circle cx="45" cy="78" r="8" fill="#0D1117" stroke="#2F81F7" stroke-width="2"/>
    <circle cx="45" cy="128" r="8" fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="45" cy="178" r="8" fill="#0D1117" stroke="#39D0C6" stroke-width="2" filter="url(#softGlow)"/>

    <rect x="72" y="60" width="271" height="37" rx="7" fill="#161B22" stroke="#21262D"/>
    <text x="88" y="76" class="mono pipelineText" fill="#F0F6FC">ENTRADA</text><text x="88" y="89" class="mono pipelineMeta" fill="#8B949E">SQL  ·  API  ·  ARQUIVOS</text>
    <rect x="72" y="110" width="271" height="37" rx="7" fill="#161B22" stroke="#21262D"/>
    <text x="88" y="126" class="mono pipelineText" fill="#F0F6FC">PROCESSAMENTO</text><text x="88" y="139" class="mono pipelineMeta" fill="#8B949E">PYTHON  ·  AUTOMAÇÃO</text>
    <rect x="72" y="160" width="271" height="37" rx="7" fill="#161B22" stroke="#238636" stroke-opacity=".7"/>
    <text x="88" y="176" class="mono pipelineText" fill="#F0F6FC">INTELIGÊNCIA</text><text x="88" y="189" class="mono pipelineMeta" fill="#39D0C6">RAG  ·  EMBEDDINGS  ·  CONTEXTO</text>
    <rect x="22" y="211" width="338" height="2" rx="1" fill="#21262D"/><rect x="22" y="211" width="224" height="2" rx="1" fill="url(#accent)"/>
  </g>

  <circle cx="1139" cy="296" r="3" fill="#39D0C6"/>
  <text x="1127" y="300" class="mono" font-size="10" text-anchor="end" letter-spacing="1.2" fill="#6E7681">BETIM · MG</text>
  <rect x=".5" y=".5" width="1199" height="319" rx="17.5" fill="none" stroke="#30363D"/>
</svg>
